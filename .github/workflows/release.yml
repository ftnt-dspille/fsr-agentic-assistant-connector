# Publishes the connector tarball when a version tag v<X.Y.Z> is pushed.
#
# 1. fails unless the tag equals "version" in connector-fsr-agentic-assistant/info.json;
# 2. runs the connector suite and the hermetic contract self-test against the
#    pinned framework wheel (the same gates as ci.yml and build.sh);
# 3. builds connector-fsr-agentic-assistant-<version>.tgz with scripts/build.sh
#    (framework + pyfsr wheels bundled for air-gapped installs);
# 4. creates the GitHub release for the tag with the .tgz attached.
#
# The solution pack (ftnt-dspille/solution-pack-fsr-agentic-assistant) builds from this
# release asset.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FSRPB_DEV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: connector-fsr-agentic-assistant/requirements.txt

      - name: Verify the tag matches info.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(python -c "import json;print(json.load(open('connector-fsr-agentic-assistant/info.json'))['version'])")"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match info.json version $VERSION"
            exit 1
          fi

      - name: Install
        run: |
          sudo apt-get install -y -qq rsync >/dev/null
          pip install -r connector-fsr-agentic-assistant/requirements.txt
          pip install "pytest>=7" "pytest-randomly>=3" "pytest-timeout>=2" "pytest-xdist>=3" "ruff==0.15.20"

      - name: Framework tooling at the pinned tag
        run: |
          FW_VER=$(sed -n 's/^fsr-playbooks==//p' connector-fsr-agentic-assistant/requirements.txt)
          git clone -q --depth 1 --branch "v$FW_VER" https://github.com/ftnt-dspille/fsr-playbook-framework.git /tmp/fsr-playbook-framework
          echo "FSRPB_FRAMEWORK_DIR=/tmp/fsr-playbook-framework" >> "$GITHUB_ENV"
          echo "PYTHONPATH=/tmp/fsr-playbook-framework/tooling" >> "$GITHUB_ENV"

      - name: Test
        run: python -m pytest -q --no-header

      - name: Contract self-test (hermetic)
        run: python scripts/validate_connector.py --hermetic

      - name: Build the tarball
        # build.sh's own self-test resolves the local dev venv; the step above
        # already ran it against this job's interpreter.
        env:
          SKIP_CONTRACT_SELFTEST: "1"
        run: |
          set -euo pipefail
          bash scripts/build.sh
          ls -l dist
          tar -tzf dist/connector-fsr-agentic-assistant-*.tgz | head -20

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # This version's section of release_notes.md only.
          awk -v v="## ${TAG#v} " 'index($0,v)==1{on=1;next} on&&/^## /{exit} on' \
            connector-fsr-agentic-assistant/release_notes.md > /tmp/notes.md
          gh release create "$TAG" dist/connector-fsr-agentic-assistant-*.tgz \
            --verify-tag --title "$TAG" --notes-file /tmp/notes.md
