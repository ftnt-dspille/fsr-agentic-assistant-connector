    # scripts/eval_s2_modify.py only re-exports it.
    repo: framework
    file: fsr_playbooks/harness/frames.py
    old: |2
          fenced = extracted_yaml(fs)
          if fenced.strip():
              return fenced
    new: ""
    tests:
      # Runs in the framework copy; the fence_only_reply golden file is the case.
      - fsr_playbooks/tests/test_harness_golden_frames.py::test_delivered_yaml_matches_the_offer_fence_carrier_order

