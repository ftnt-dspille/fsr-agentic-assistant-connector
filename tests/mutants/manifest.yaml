# Mutation manifest: one entry per named fix, read by scripts/mutation_check.py
# (`make mutants`). Each entry says how to UNDO a fix in a temp copy, and which
# test must go red when it is undone.
#
#   id      stable name, printed in the report
#   fix     one line: what the fix does (commit in brackets)
#   repo    connector (this checkout, default) | framework (FSRPB_FRAMEWORK, or
#           ~/PycharmProjects/fsr-playbook-framework)
#   file    path inside `repo`; old/new is an exact text swap that must occur
#           exactly once in HEAD (so a stale entry fails loudly, not silently)
#   tests   node ids to run. A bare `file::test` selects every parametrisation.
#           All must pass on HEAD, or the entry reports HEAD-RED and is not run.
#   expect  failed (default) or skipped: the outcome that counts as CAUGHT
#   env     env override for the MUTANT run only. With no file/old/new, this is
#           the whole revert: it models a configuration fix (Makefile export).
mutants:
  - id: delivered_yaml_fence_fallback
